actions:
  - name: "Test Linux assembly"
    container_image: "ubuntu-20.04"
    triggers:
      push:
        branches: ["main", "gh-readonly-queue/*"]
      pull_request:
        branches: ["main"]
    resource_requests:
      memory: 4GB
      disk: 16GB
    steps:
      - run: |
          set -euo pipefail
          public_downloader="$PWD/tools/ci/public-downloader.cfg"
          public_distdir="$(mktemp -d /tmp/electron-signing-sources.XXXXXX)"
          python3 tools/ci/prefetch_signing_sources.py "$public_distdir"
          bazel test --config=bb-workflow --downloader_config="$public_downloader" --distdir="$public_distdir" --test_output=errors //...
          bazel run --config=bb-workflow --downloader_config="$public_downloader" --distdir="$public_distdir" @buildifier_prebuilt//:buildifier -- -mode=check -r .

  - name: "Cross-build Electron Apps"
    container_image: "ubuntu-20.04"
    triggers:
      push:
        branches: ["main", "gh-readonly-queue/*", "codex/prebuilt-sample-benchmark"]
      pull_request:
        branches: ["main"]
    resource_requests:
      memory: 8GB
      disk: 32GB
    steps:
      - run: |
          set -euo pipefail
          source_root="$PWD"
          public_downloader="$PWD/tools/ci/public-downloader.cfg"
          public_distdir="$(mktemp -d /tmp/electron-signing-sources.XXXXXX)"
          python3 tools/ci/prefetch_signing_sources.py "$public_distdir"
          bazel build --config=bb-workflow --downloader_config="$public_downloader" --distdir="$public_distdir" \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/fixture-profile.json.gz" \
            //tests:cross_build_fixtures
          cd examples/desktop
          bazel test --config=bb-workflow --downloader_config="$public_downloader" --distdir="$public_distdir" --lockfile_mode=error //tools:file_matcher_test
          bazel build --config=bb-workflow --downloader_config="$public_downloader" --distdir="$public_distdir" --config=msvc-license --lockfile_mode=error --remote_download_toplevel \
            --modify_execution_info='^(Electron.*|MakeDeb)$=+no-cache' \
            --build_metadata=PREBUILT_SAMPLE_PACKAGING_CACHE=bypassed \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/cross-build-profile.json.gz" \
            --experimental_profile_additional_tasks=remote_queue \
            --experimental_profile_additional_tasks=remote_process_time \
            --experimental_profile_additional_tasks=remote_download \
            --experimental_profile_additional_tasks=remote_cache_check \
            //:cross_build_smoke_bundle
          app_inputs="$(mktemp /tmp/electron-app-inputs.XXXXXX.json)"
          bazel aquery --config=bb-workflow --downloader_config="$public_downloader" --distdir="$public_distdir" --config=msvc-license --lockfile_mode=error \
            --modify_execution_info='^(Electron.*|MakeDeb)$=+no-cache' \
            --output=jsonproto 'mnemonic("(?i)^(ElectronApp|ElectronDmg|ElectronDmgLicense|.*(foreign.?cc|cmake|meson|ninja).*|g?make|runmake|gn|rungn)$", deps(//:cross_build_smoke_bundle))' > "$app_inputs"
          python3 "$source_root/tools/ci/platform_inputs_audit.py" "$app_inputs"
          rm "$app_inputs"
          cp bazel-bin/electron-smoke-*.zip "$BUILDBUDDY_ARTIFACTS_DIRECTORY/"

  - name: "Source-built desktop example"
    container_image: "ubuntu-24.04"
    allow_concurrent_runs: false
    allow_concurrent_runs_on_branches: []
    timeout: 2h
    triggers:
      push:
        branches: ["codex/source-example-ci"]
    resource_requests:
      cpu: 16
      memory: 32GB
      disk: 100GB
    steps:
      - run: |
          set -euo pipefail
          source_root="$PWD"
          source_setup="$(mktemp -d /tmp/electron-example-setup.XXXXXX)"
          source_registry="$(mktemp -d /tmp/electron-example-registry.XXXXXX)"
          source_distdir="$(mktemp -d /tmp/electron-example-distdir.XXXXXX)"
          python3 - <<'PY'
          import json
          import os
          print("SOURCE_FRONTEND_RESOURCES " + json.dumps({"cpu_count": os.cpu_count(), "cpu_affinity": len(os.sched_getaffinity(0))}, sort_keys=True))
          PY
          bazel run --config=bb-workflow //tools/ci:stage_source_registry -- \
            --output="$source_registry" --setup-directory="$source_setup"
          bash "$source_setup/source_bootstrap" "$source_distdir"
          python3 tools/ci/prefetch_signing_sources.py "$source_distdir"
          cat tools/ci/public-downloader.cfg "$source_setup/source_downloader.cfg" > "$source_setup/downloader.cfg"
          python3 tools/ci/prepare_source_example.py \
            --source="$source_root/examples/desktop" --output="$source_root/examples/source-desktop"
          cd examples/source-desktop
          python3 "$source_setup/source_audit" --registry="file://$source_registry" \
            --downloader-config="$source_setup/downloader.cfg" --distdir="$source_distdir"
          bazel --host_jvm_args=-Xmx24g cquery --config=bb-workflow --config=msvc-license \
            --registry="file://$source_registry" --registry=https://bcr.bazel.build \
            --downloader_config="$source_setup/downloader.cfg" --distdir="$source_distdir" \
            'filter("bootstrap_electron_linux_x64|//source/distribution:runtime$", deps(//:cross_build_smoke_bundle))' \
            --output=label > "$source_setup/runtime-deps"
          python3 - "$source_setup/runtime-deps" <<'PY'
          from pathlib import Path
          import re
          import sys
          labels = Path(sys.argv[1]).read_text().splitlines()
          assert not any("bootstrap_electron_linux_x64" in label for label in labels), "Bootstrap Linux runtime reached source example"
          assert any(re.search(r"//source/distribution:runtime(?:\s|$)", label) for label in labels), "Source runtime missing from example"
          PY
          echo SOURCE_DESKTOP_DEPENDENCY_AUDIT_PASSED
          bazel --host_jvm_args=-Xmx24g test --config=bb-workflow \
            --registry="file://$source_registry" --registry=https://bcr.bazel.build \
            --downloader_config="$source_setup/downloader.cfg" --distdir="$source_distdir" \
            //tools:file_matcher_test
          cp MODULE.bazel.lock "$BUILDBUDDY_ARTIFACTS_DIRECTORY/source-example-analysis-MODULE.bazel.lock"
          source_metrics_pid=""
          stop_source_metrics() {
            if [[ -n "$source_metrics_pid" ]]; then
              kill "$source_metrics_pid" 2>/dev/null || true
              wait "$source_metrics_pid" 2>/dev/null || true
              source_metrics_pid=""
            fi
          }
          trap stop_source_metrics EXIT
          if source_server_pid="$(bazel --host_jvm_args=-Xmx24g info server_pid)"; then
            python3 "$source_root/tools/ci/source_frontend_metrics.py" --pid "$source_server_pid" \
              --output "$BUILDBUDDY_ARTIFACTS_DIRECTORY/source-frontend-metrics.jsonl" &
            source_metrics_pid="$!"
          fi
          bazel --host_jvm_args=-Xmx24g build --config=bb-workflow --config=msvc-license --remote_download_toplevel \
            --discard_analysis_cache --notrack_incremental_state \
            --registry="file://$source_registry" --registry=https://bcr.bazel.build \
            --downloader_config="$source_setup/downloader.cfg" --distdir="$source_distdir" \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/cross-build-profile.json.gz" \
            --experimental_profile_additional_tasks=remote_queue \
            --experimental_profile_additional_tasks=remote_process_time \
            --experimental_profile_additional_tasks=remote_download \
            --experimental_profile_additional_tasks=remote_cache_check \
            //:cross_build_smoke_bundle
          stop_source_metrics
          cp bazel-bin/electron-smoke-*.zip "$BUILDBUDDY_ARTIFACTS_DIRECTORY/"
          cp MODULE.bazel.lock "$BUILDBUDDY_ARTIFACTS_DIRECTORY/source-example-MODULE.bazel.lock"
