actions:
  - name: "Test Linux assembly"
    container_image: "ubuntu-20.04"
    triggers:
      push:
        branches: ["main", "gh-readonly-queue/*"]
      pull_request:
        branches: ["main"]
    resource_requests:
      memory: 4GB
      disk: 16GB
    steps:
      - run: |
          set -euo pipefail
          bazel test --config=bb-workflow --test_output=errors //...
          bazel run --config=bb-workflow @buildifier_prebuilt//:buildifier -- -mode=check -r .

  - name: "Cross-build Electron Apps"
    container_image: "ubuntu-20.04"
    triggers:
      push:
        branches: ["main", "gh-readonly-queue/*"]
      pull_request:
        branches: ["main"]
    resource_requests:
      memory: 8GB
      disk: 32GB
    steps:
      - run: |
          set -euo pipefail
          bazel build --config=bb-workflow \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/fixture-profile.json.gz" \
            //tests:cross_build_fixtures
          cd examples/desktop
          bazel build --config=bb-workflow --config=msvc-license --lockfile_mode=error --remote_download_toplevel \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/cross-build-profile.json.gz" \
            --experimental_profile_additional_tasks=remote_queue \
            --experimental_profile_additional_tasks=remote_process_time \
            --experimental_profile_additional_tasks=remote_download \
            --experimental_profile_additional_tasks=remote_cache_check \
            //:cross_build_smoke_bundle
          cp bazel-bin/electron-cross-smoke.zip "$BUILDBUDDY_ARTIFACTS_DIRECTORY/electron-cross-smoke.zip"
