name: Native Electron Smoke

on:
  status:
  workflow_dispatch:
    inputs:
      invocation_url:
        description: BB invocation URL (successful matrix required for native smoke)
        required: true
        type: string
      commit_sha:
        description: Exact BB build commit
        required: true
        type: string
      logs_only:
        description: Read BB logs without downloading artifacts or running smoke
        type: boolean
        default: false
      dmg_license_probe:
        description: Probe an existing BB-built DMG using the current workflow's macOS harness
        type: boolean
        default: false
      dmg_fixture:
        description: Declared DMG fixture to inspect
        type: choice
        default: release_dmg.dmg
        options: [release_dmg.dmg, release_dmg_rtf.dmg]
      source_workflows_only:
        description: Find BB source workflows for exact commit without reading logs
        type: boolean
        default: false
      build_repository:
        description: Repository for read-only diagnostics
        type: choice
        default: formatjs/rules_electron
        options: [formatjs/rules_electron, formatjs/electron]

permissions:
  contents: read

concurrency:
  group: native-electron-${{ inputs.logs_only && 'diagnostics' || inputs.dmg_license_probe && 'dmg-probe' || github.event.context || 'Cross-build Electron Apps' }}-${{ inputs.commit_sha || github.event.sha }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.logs_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read verified BB invocation logs
        if: inputs.build_repository != 'formatjs/electron'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url }}
          BUILD_SHA: ${{ inputs.commit_sha }}
        run: python3 tools/ci/buildbuddy_log.py
      - name: Read verified Electron source-overlay logs
        if: inputs.build_repository == 'formatjs/electron' && !inputs.source_workflows_only
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url }}
          BUILD_SHA: ${{ inputs.commit_sha }}
        run: python3 tools/ci/source_overlay_log.py
      - name: Find exact Electron source-overlay workflows
        if: inputs.build_repository == 'formatjs/electron' && inputs.source_workflows_only
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          BUILD_SHA: ${{ inputs.commit_sha }}
        run: python3 tools/ci/source_workflow_lookup.py

  download:
    if: >-
      !inputs.logs_only && (inputs.invocation_url != '' ||
      ((github.event.context == 'Cross-build Electron Apps' || github.event.context == 'Source-built desktop example') &&
      github.event.sender.login == 'buildbuddy-io[bot]' && github.event.state == 'success'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.dmg_license_probe && '["macos-arm64"]' || '["linux-x64", "macos-arm64", "windows-x64", "windows-arm64"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.event.sha }}
          persist-credentials: false
      - name: Download verified BB smoke shard
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url || github.event.target_url }}
          BUILD_SHA: ${{ inputs.commit_sha || github.event.sha }}
          SMOKE_SHARD: ${{ matrix.shard }}
        run: python3 tools/ci/buildbuddy_artifacts.py
      - uses: actions/upload-artifact@v7
        with:
          name: electron-smoke-${{ matrix.shard }}
          path: artifacts/electron-smoke-${{ matrix.shard }}.zip
          compression-level: 0
          retention-days: 7

  native:
    if: '!inputs.logs_only && !inputs.dmg_license_probe'
    needs: download
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x64
            shard: linux-x64
            variants: [linux_x86_64]
          - runner: macos-15
            architecture: arm64
            shard: macos-arm64
            variants: [macos_aarch64]
          - runner: windows-latest
            architecture: x64
            shard: windows-x64
            variants: [windows_x86_64_gnullvm, windows_x86_64_msvc]
          - runner: windows-11-arm
            architecture: arm64
            shard: windows-arm64
            variants: [windows_aarch64_gnullvm, windows_aarch64_msvc]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.event.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: electron-smoke-${{ matrix.shard }}
          path: artifacts
      - name: Install Linux GUI test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2 libgbm1 desktop-file-utils shared-mime-info hicolor-icon-theme libglib2.0-bin p7zip-full fuse3
      - name: Smoke BB-built apps on native host
        env:
          SMOKE_VARIANTS: ${{ toJSON(matrix.variants) }}
          SMOKE_SHARD: ${{ matrix.shard }}
        run: python -m tools.ci.run_native_smoke

  dmg_probe:
    if: inputs.dmg_license_probe && !inputs.logs_only
    needs: download
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: actions/download-artifact@v8
        with:
          name: electron-smoke-macos-arm64
          path: artifacts
      - name: Probe BB-built license image
        env:
          DMG_FIXTURE: ${{ inputs.dmg_fixture || 'release_dmg.dmg' }}
        run: python -m tools.ci.dmg_license_smoke artifacts/electron-smoke-macos-arm64.zip "$DMG_FIXTURE"

  publish_status:
    if: always() && !inputs.logs_only && !inputs.dmg_license_probe && needs.download.result != 'skipped'
    needs: [download, native]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record native smoke result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.commit_sha || github.event.sha }}
          RESULTS: ${{ toJSON(needs) }}
          SMOKE_STATUS_CONTEXT: ${{ github.event.context == 'Source-built desktop example' && 'Native Electron Smoke (source Linux x64)' || 'Native Electron Smoke' }}
        run: |
          state=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<< "$RESULTS")
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$BUILD_SHA" \
            -f state="$state" -f context="$SMOKE_STATUS_CONTEXT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Native smoke: $state"
