name: Native Electron Smoke

on:
  status:
  workflow_dispatch:
    inputs:
      invocation_url:
        description: Successful Cross-build Electron Apps invocation URL
        required: true
        type: string
      commit_sha:
        description: Exact BB build commit
        required: true
        type: string
      logs_only:
        description: Read BB logs without downloading artifacts or running smoke
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-electron-${{ inputs.logs_only && 'diagnostics' || github.event.context || 'Cross-build Electron Apps' }}-${{ inputs.commit_sha || github.event.sha }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.logs_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read verified BB invocation logs
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url }}
          BUILD_SHA: ${{ inputs.commit_sha }}
        run: python3 tools/ci/buildbuddy_log.py

  download:
    if: >-
      !inputs.logs_only && (inputs.invocation_url != '' ||
      (github.event.context == 'Cross-build Electron Apps' &&
      github.event.sender.login == 'buildbuddy-io[bot]' && github.event.state == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Download verified BB matrix artifact
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url || github.event.target_url }}
          BUILD_SHA: ${{ inputs.commit_sha || github.event.sha }}
        run: python3 tools/ci/buildbuddy_artifacts.py
      - uses: actions/upload-artifact@v7
        with:
          name: electron-cross-smoke
          path: artifacts/electron-cross-smoke.zip
          retention-days: 7

  native:
    if: '!inputs.logs_only'
    needs: download
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x64
            variants: [linux_x86_64]
          - runner: macos-15
            architecture: arm64
            variants: [macos_aarch64]
          - runner: windows-latest
            architecture: x64
            variants: [windows_x86_64_gnullvm, windows_x86_64_msvc]
          - runner: windows-11-arm
            architecture: arm64
            variants: [windows_aarch64_gnullvm, windows_aarch64_msvc]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: electron-cross-smoke
          path: artifacts
      - name: Install Linux GUI test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2 libgbm1 desktop-file-utils shared-mime-info hicolor-icon-theme xdg-utils
      - name: Smoke BB-built apps on native host
        env:
          SMOKE_VARIANTS: ${{ toJSON(matrix.variants) }}
        run: python tools/ci/run_native_smoke.py

  publish_status:
    if: always() && !inputs.logs_only && needs.download.result != 'skipped'
    needs: [download, native]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record native smoke result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.commit_sha || github.event.sha }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          state=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<< "$RESULTS")
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$BUILD_SHA" \
            -f state="$state" -f context='Native Electron Smoke' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Native smoke: $state"
