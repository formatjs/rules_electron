name: Source ARM64 metadata handoff

on:
  workflow_dispatch:
    inputs:
      invocation_url:
        description: Successful overlay ARM64 metadata capture on BB
        required: true
        type: string
      commit_sha:
        description: Exact formatjs/electron build commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download verified source metadata
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url }}
          BUILD_SHA: ${{ inputs.commit_sha }}
        run: python3 tools/ci/source_metadata.py
      - uses: actions/upload-artifact@v7
        with:
          name: electron-linux-arm64-metadata
          path: artifacts/electron-linux-arm64-metadata/
          if-no-files-found: error
          retention-days: 7
