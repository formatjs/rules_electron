name: BuildBuddy CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buildbuddy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BB_RO_KEY: ${{ vars.BB_RO_KEY }}

jobs:
  test:
    name: Test Linux assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'perplexityai/rules_electron' && 'ci' || '' }}
    env:
      BB_RW_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'perplexityai/rules_electron' && secrets.BB_RW_KEY || '' }}
      BUILDBUDDY_ARTIFACTS_DIRECTORY: ${{ github.workspace }}/.ci-artifacts/test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildbuddy
      - name: Build on BB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILDBUDDY_ARTIFACTS_DIRECTORY"
          public_downloader="$PWD/tools/ci/public-downloader.cfg"
          public_distdir="$(mktemp -d /tmp/electron-signing-sources.XXXXXX)"
          python3 tools/ci/prefetch_signing_sources.py "$public_distdir"
          bazel test --downloader_config="$public_downloader" --distdir="$public_distdir" --test_output=errors //tests:ci_bazel_test
          bazel test --downloader_config="$public_downloader" --distdir="$public_distdir" --test_output=errors //...
          bazel run --downloader_config="$public_downloader" --distdir="$public_distdir" @buildifier_prebuilt//:buildifier -- -mode=check -r .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-profiles
          path: .ci-artifacts/test/*.json*
          if-no-files-found: ignore
          retention-days: 7

  cross-build:
    name: Cross-build Electron Apps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'perplexityai/rules_electron' && 'ci' || '' }}
    env:
      BB_RW_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'perplexityai/rules_electron' && secrets.BB_RW_KEY || '' }}
      BUILDBUDDY_ARTIFACTS_DIRECTORY: ${{ github.workspace }}/.ci-artifacts/cross-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildbuddy
      - name: Build on BB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILDBUDDY_ARTIFACTS_DIRECTORY"
          source_root="$PWD"
          public_downloader="$PWD/tools/ci/public-downloader.cfg"
          public_distdir="$(mktemp -d /tmp/electron-signing-sources.XXXXXX)"
          python3 tools/ci/prefetch_signing_sources.py "$public_distdir"
          bazel build --downloader_config="$public_downloader" --distdir="$public_distdir" \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/fixture-profile.json.gz" \
            //tests:cross_build_fixtures
          cd examples/desktop
          bazel test --downloader_config="$public_downloader" --distdir="$public_distdir" --lockfile_mode=error //tools:file_matcher_test
          bazel build --downloader_config="$public_downloader" --distdir="$public_distdir" --config=msvc-license --lockfile_mode=error --remote_download_toplevel \
            --profile="$BUILDBUDDY_ARTIFACTS_DIRECTORY/cross-build-profile.json.gz" \
            --experimental_profile_additional_tasks=remote_queue \
            --experimental_profile_additional_tasks=remote_process_time \
            --experimental_profile_additional_tasks=remote_download \
            --experimental_profile_additional_tasks=remote_cache_check \
            //:cross_build_smoke_bundle
          app_inputs="$(mktemp /tmp/electron-app-inputs.XXXXXX.json)"
          bazel aquery --downloader_config="$public_downloader" --distdir="$public_distdir" --config=msvc-license --lockfile_mode=error \
            --output=jsonproto 'mnemonic("(?i)^(ElectronApp|ElectronDmg|ElectronDmgLicense|.*(foreign.?cc|cmake|meson|ninja).*|g?make|runmake|gn|rungn)$", deps(//:cross_build_smoke_bundle))' > "$app_inputs"
          python3 "$source_root/tools/ci/platform_inputs_audit.py" "$app_inputs"
          rm "$app_inputs"
          cp bazel-bin/electron-smoke-*.zip "$BUILDBUDDY_ARTIFACTS_DIRECTORY/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-smoke-linux-x64
          path: .ci-artifacts/cross-build/electron-smoke-linux-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-smoke-macos-arm64
          path: .ci-artifacts/cross-build/electron-smoke-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-smoke-windows-x64
          path: .ci-artifacts/cross-build/electron-smoke-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: electron-smoke-windows-arm64
          path: .ci-artifacts/cross-build/electron-smoke-windows-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cross-build-profiles
          path: .ci-artifacts/cross-build/*.json*
          if-no-files-found: ignore
          retention-days: 7

  native-smoke:
    needs: cross-build
    uses: ./.github/workflows/native-artifacts.yml

  ci:
    name: CI
    if: always()
    needs: [test, cross-build, native-smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items()
                    if job['result'] != 'success']
          if failed:
              raise SystemExit('Failed or skipped checks: ' + ', '.join(failed))
          PYCODE
